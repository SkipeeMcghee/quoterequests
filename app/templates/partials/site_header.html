<header class="site-header site-header--brochure">
  <div class="site-header__lead">
    <a class="brand brand--logo" {% if public_page_enabled('home') %}href="{{ url_for('main.index') }}" aria-label="{{ business_name }} home"{% else %}aria-label="{{ business_name }}"{% endif %}>
      {% if site_logo.path %}
        <img class="brand__image" src="{{ url_for('static', filename=site_logo.path) }}" alt="{{ site_logo.alt or business_name }}">
      {% else %}
        {{ business_name }}
      {% endif %}
    </a>
    <div class="site-header__copy">
      <strong>{{ tagline }}</strong>
      <span>Serving {{ service_area }}</span>
    </div>
  </div>

  <div class="site-header__nav-group">
    <nav class="site-nav site-nav--brochure" aria-label="Primary navigation">
      {% for link in public_nav_links %}
        <a href="{{ link.get('url') }}" {% if request.path == link.get('url') %}aria-current="page"{% endif %}>{{ link.get('label') }}</a>
      {% endfor %}
    </nav>

    <div class="site-header__actions">
      {% if public_page_enabled('quote_request') %}
        <a class="btn btn-primary btn-small" href="{{ url_for('main.quote_request') }}">Get a Quote</a>
      {% endif %}
      <div class="site-utility-nav">
        <a href="tel:{{ phone }}">{{ phone }}</a>
        <a href="mailto:{{ email }}">{{ email }}</a>
      </div>
    </div>
  </div>
</header>
