# nginx site config for the Quote Requests app.
# Install to /etc/nginx/sites-available/quoterequests and symlink into sites-enabled.
# Replace example.com and the certificate paths (certbot rewrites those for you).

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # certbot --nginx drops its challenge here and then adds the TLS block.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Slightly above MAX_CONTENT_LENGTH (25 MB) so Flask can return its branded 413
    # page instead of nginx returning its own.
    client_max_body_size 26m;

    access_log /var/log/nginx/quoterequests.access.log;
    error_log  /var/log/nginx/quoterequests.error.log;

    # All uploads require tenant resolution, including public gallery images.
    # Never expose the old shared uploads tree through nginx.
    location ~* ^/static/uploads(?:/|$) {
        return 404;
    }

    # Shared code/branding assets are public; uploads are excluded above.
    location /static/ {
        alias /srv/quoterequests/app/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;
        proxy_read_timeout 90s;
    }
}
